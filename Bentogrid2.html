<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social Media AI</title>

    <!-- DM Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style4.css">
</head>

<body>

    <main class="container">

        <!-- Hero -->
        <section class="card hero">
            <h1>
                Social Media<br>
                <span>10x Faster</span><br>
                with AI
            </h1>

            <img src="fivestars.jpg" alt="Five star rating" >

            <p>Over 4,000 5-star reviews</p>
        </section>


        <!-- Manage accounts -->
        <section class="card image-card">
            <img src="platforms.jpg" alt="Manage multiple accounts">
        </section>


        <!-- Posting schedule -->
        <div class="card-one">
      <section class="card image-card">        
            <img src="schedule.jpg" alt="Posting schedule">
          </div>
        </section>


        <!-- Schedule -->
        <section class="card image-card">
          <div class="card-two">
          <h2>Schedule to social media</h2>
            <br>
            <img src="illustration.jpg" alt="Schedule to social media">
            <span class="span-2"> optimize post timings to publish content
              at the perfect time for<br> your audience. </span>
          </div>
        </section>


        <!-- Followers -->
        <section class="card image-card">
          <div class="card-three">
            <img src="followers.jpg" alt="Grow followers">
          </div>
        </section>


        <!-- Audience growth -->
        <section class="card image-card">
         <div class="card-four">
          <h1>
                >56%</h1><br>
                <p>faster audience growth</p>
           <br>
      
                    
         <img src="audience.jpg" alt="Audience growth">
                    </div>
        </section>


        <!-- Create and schedule -->
        <section class="card create">
            <h2>
                Create and schedule<br>
                content <i>quicker.</i>
            </h2>

            <section class="card image-card">
              <img src="post.jpg" alt="Create and schedule content quicker">
            </section>
        </section>


        <!-- AI content -->
        <section class="card image-card">
             <div class="card-seven">     
              <span> Write your content<br> using AI.</span>
          <img src="content.jpg" alt="Write your content using AI">
        </section>

    </main>

</body>
</html>
